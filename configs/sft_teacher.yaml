architecture_config: teacher_architecture.yaml

pretrained_checkpoint_root: checkpoints/student

data:
  seed: 2317
  batch_size: 8
  max_text_length: 1024

  text_probability: 0.3
  cot_probability: 0.90

  difficulty_weights:
    easy: 0.20
    medium: 0.30
    hard: 0.50

optimizer:
  muon_lr: 0.0003
  adamw_lr: 0.0001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  total_steps: 3000
  warmup_steps: 300

runtime:
  devices: 2
  microbatch_size: 4
  max_updates: 3000

  log_every: 50
  evaluate_every: 500
  save_every: 500

  checkpoint_root: checkpoints/teacher
  resume_from: null

evaluation:
  seed: 2026
  examples_per_group: 10
  exact_examples_per_level: 10
  max_new_tokens: 512
