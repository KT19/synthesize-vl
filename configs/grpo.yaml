policy_checkpoint_root: checkpoints/opd
architecture_config: configs/student_architecture.yaml

grpo:
  # Group per batch
  group_size: 8

data:
  seed: 2401
  batch_size: 4
  max_text_length: 1024

  text_probability: 0.5
  cot_probability: 1.0

  difficulty_weights:
    easy: 0.20
    medium: 0.50
    hard: 0.30

optimizer:
  muon_lr: 0.00005
  adamw_lr: 0.00001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  total_steps: 200 # multiple of PPO epochs
  warmup_steps: 20 # multiple of PPO epochs

rollout:
  seed: 2507
  context_length: 512
  new_tokens: 256
  clip_epsilon: 0.2
  ppo_epochs: 2

runtime:
  devices: 2
  max_updates: 100
  log_every: 1
  evaluate_every: 50
  save_every: 50
  max_uninformative_streak: 10

  checkpoint_root: checkpoints/grpo
  resume_from: null

evaluation:
  examples_per_group: 10
  exact_examples_per_level: 10
  max_new_tokens: 512
  seed: 2026
