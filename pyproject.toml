[project]
name = "synthesize_vl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flax>=0.12.8",
    "jax[cuda13]>=0.10.2",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.7",
    "pillow>=12.3.0",
